{% extends "allianceauth/base-bs5.html" %}
{% block page_title %}Target Board{% endblock %}

{% block content %}
<h3 class="mb-3">{% if mode == "edit" %}Edit Target{% else %}Add Target{% endif %}</h3>

<div class="card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-outline-secondary" href="{% url 'aa_targetboard:list' %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
